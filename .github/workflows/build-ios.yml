name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip and Fix Xcode Project
        run: |
          unzip -o -q SpaceShooter-iOS.zip || true
          
          # Fix AI syntax error: replace PBXConfigurationList with valid XCConfigurationList
          find . -name "project.pbxproj" -exec sed -i '' 's/PBXConfigurationList/XCConfigurationList/g' {} +
          
          echo "Fixed project.pbxproj syntax"

      - name: Build Xcode Project
        run: |
          # Detect available scheme
          SCHEME=$(xcodebuild -list -project SpaceShooter.xcodeproj | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME="SpaceShooter"
          fi
          echo "Selected Scheme: $SCHEME"

          xcodebuild clean build \
            -project SpaceShooter.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./build_output -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Packaging application from: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -q SpaceShooter.ipa Payload
          ls -lh SpaceShooter.ipa

      - name: Upload Downloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceShooter-iOS-IPA
          path: SpaceShooter.ipa
          if-no-files-found: error
