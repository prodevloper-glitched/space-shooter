name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o -q SpaceShooter-iOS.zip || true
          ls -la

      - name: Build Xcode Project
        run: |
          xcodebuild clean archive \
            -project SpaceShooter.xcodeproj \
            -scheme SpaceShooter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SpaceShooter.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/SpaceShooter.xcarchive -name "SpaceShooter.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Packaging application from: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -q SpaceShooter.ipa Payload
          ls -lh SpaceShooter.ipa

      - name: Upload Downloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceShooter-iOS-IPA
          path: SpaceShooter.ipa
          if-no-files-found: error
