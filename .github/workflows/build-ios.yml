name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o SpaceShooter-iOS.zip
          ls -la

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Xcode Project
        run: |
          xcodebuild -project SpaceShooter.xcodeproj \
            -scheme SpaceShooter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SpaceShooter.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          # Automatically find SpaceShooter.app inside the archive
          APP_PATH=$(find build/SpaceShooter.xcarchive -name "SpaceShooter.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          cp -r "$APP_PATH" Payload/
          zip -r SpaceShooter.ipa Payload
          ls -lh SpaceShooter.ipa

      - name: Upload Downloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceShooter-iOS-IPA
          path: SpaceShooter.ipa
          if-no-files-found: error
