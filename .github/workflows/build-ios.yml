name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Xcode Project
        working-directory: ios-app
        run: |
          xcodebuild -project SpaceShooter.xcodeproj \
            -scheme SpaceShooter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SpaceShooter.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        working-directory: ios-app
        run: |
          mkdir -p Payload
          cp -r build/SpaceShooter.xcarchive/Products/Applications/SpaceShooter.app Payload/
          zip -r SpaceShooter.ipa Payload
          mv SpaceShooter.ipa ../SpaceShooter.ipa

      - name: Upload Downloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceShooter-iOS-IPA
          path: SpaceShooter.ipa
          if-no-files-found: error
